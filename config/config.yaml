# ==============================
# Academic Intelligence AI - Configuration
# ==============================

# --- Crawl Domains ---
# Each domain is crawled recursively (BFS). HTML pages and PDF files are downloaded.
# purpose: general_info | news | study_programs | department_info | student_events | admissions | admissions_tests
crawl_domains:
  - name: "pmf_uns"
    purpose: "general_info"
    base_url: "https://www.pmf.uns.ac.rs/"
    enabled: true

  - name: "dmi"
    purpose: "department_info"
    base_url: "https://www.dmi.uns.ac.rs/"
    enabled: true

  - name: "df"
    purpose: "department_info"
    base_url: "http://www.df.uns.ac.rs/"
    enabled: true

  - name: "dh"
    purpose: "department_info"
    base_url: "https://www.dh.uns.ac.rs/"
    enabled: true

  - name: "dbe"
    purpose: "department_info"
    base_url: "https://wwwold.dbe.pmf.uns.ac.rs/"
    enabled: true

  - name: "dgt"
    purpose: "department_info"
    base_url: "https://www.dgt.uns.ac.rs/"
    enabled: true

# --- Crawler Settings ---
crawler:
  delay_seconds: 0.5
  max_pages_per_domain: 15000  # safety limit per domain (faculty sites are typically < 3000)
  request_timeout: 15
  user_agent: "AcademicIntelligenceAI/0.1 (educational research bot)"
  download_pdfs: true
  download_docs: true  # .doc, .docx, .xls, .xlsx, .ppt, .pptx
  max_pdf_size_mb: 50
  respect_robots_txt: true
  # File extensions to skip (binary, media, etc.)
  skip_extensions: [".jpg", ".jpeg", ".png", ".gif", ".svg", ".ico", ".webp",
                     ".mp3", ".mp4", ".avi", ".mov", ".wmv",
                     ".zip", ".rar", ".tar", ".gz",
                     ".exe", ".dll", ".bin",
                     ".css", ".js", ".woff", ".woff2", ".ttf", ".eot"]

# --- Legacy single-page sources (kept for backwards compatibility) ---
sources:
  - name: "reddit_pmf"
    type: "html"
    purpose: "student_questions"
    url: "https://www.reddit.com/r/StudentiSrbija/search/?q=pmf"
    enabled: true

# --- Transform ---
transform:
  min_text_length: 200
  strip_tags: ["script", "style", "noscript", "header", "footer", "nav"]
  pdf_max_pages: 500

# --- Chunking ---
chunking:
  chunk_size: 400
  chunk_overlap: 80
  min_chunk_size: 50


# --- Load ---
load:
  limit: 0  # 0 = all files, >0 = first N chunked files (for progressive scaling)

# --- Embedding ---
embedding:
  model: "paraphrase-multilingual-MiniLM-L12-v2"
  dimension: 384
  batch_size: 32

# --- Vector DB ---
vector_db:
  engine: "faiss"
  index_path: "data/embeddings/faiss_index"
  similarity_metric: "cosine"

# --- RAG / Query ---
query:
  max_context_chunks: 5
  confidence_threshold: 0.5
  retrieval_multiplier: 3    # fetch top_k * N from FAISS before post-filtering
  high_relevance_boost: 1.2  # score multiplier for high-relevance documents
  exclude_pdfs: true
  allowed_categories:  # only these categories pass the filter (null = allow all)
    - department-info
    - news-announcements
    - staff-pages
    - study-programs

# --- LLM ---
llm:
  provider: "ollama"
  model: "mistral"
  base_url: "http://localhost:11434"
  max_tokens: 512
  temperature: 0.2

# --- Paths ---
paths:
  raw_data: "data/raw/"
  processed_data: "data/processed/"
  chunked_data: "data/chunked/"
  embeddings: "data/embeddings/"

# --- Monitoring ---
monitoring:
  log_level: "INFO"
  log_file: "logs/pipeline.log"
  track_drift: true
  drift_check_interval_hours: 24
  chunk_drift_threshold_pct: 20.0
